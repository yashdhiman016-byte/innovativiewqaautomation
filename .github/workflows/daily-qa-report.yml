name: Daily Innovatiview QA report

# Run at 09:00 India time each day; workflow_dispatch also enables an on-demand run from the Actions UI.
on:
  schedule:
    - cron: '0 9 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  # Default to read-only; the job grants only the extra permissions needed to publish Pages.
  contents: read

# Avoid overlapping deployments to the same Pages site; queued runs are allowed to finish.
concurrency:
  group: innovatiview-qa-pages
  cancel-in-progress: false

jobs:
  test-report-and-email:
    runs-on: ubuntu-latest
    # Prevent a hung external-site test or email/report command from consuming a runner indefinitely.
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Run Selenium tests
        id: tests
        # Preserve execution so the report/email can still explain a test failure; a final step restores failure status.
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.innovatiview.com' }}
        run: >-
          mvn --batch-mode
          -Dheadless=true
          -DbaseUrl="$SITE_URL/contact"
          -DsiteUrl="$SITE_URL"
          test

      - name: Validate email configuration
        id: email_config
        # Validate secret presence without printing secret values; still run after test failures.
        if: always()
        env:
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          missing=0
          for name in GMAIL_FROM GMAIL_TO GMAIL_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions setting is missing: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Generate static Allure report and ZIP
        id: report
        # Generate evidence even when tests fail; later steps gate publishing and email on report success.
        if: always()
        run: |
          mvn --batch-mode io.qameta.allure:allure-maven:2.15.0:report
          mkdir -p public
          cp -R target/site/allure-maven-plugin/. public/
          touch public/.nojekyll
          (cd public && zip -qr ../target/allure-report.zip .)

      - name: Upload downloadable Allure report
        # Keep a versioned downloadable copy separate from the Pages deployment (retained for 14 days).
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: innovatiview-allure-report-${{ github.run_number }}
          path: target/allure-report.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload report for GitHub Pages
        # Pages consumes an artifact produced by this action before the deploy step publishes it.
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Publish Allure report to GitHub Pages
        id: deployment
        if: always() && steps.report.outcome == 'success'
        uses: actions/deploy-pages@v5

      - name: Email pass/fail report
        # Email only when the report exists and all required credentials were validated.
        if: always() && steps.report.outcome == 'success' && steps.email_config.outcome == 'success'
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_FROM }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Innovatiview QA <${{ secrets.GMAIL_FROM }}>
          to: ${{ secrets.GMAIL_TO }}
          subject: Innovatiview QA automation report
          body: |
            Innovatiview QA automation result

            Here is the automatically generated QA report.

            note: if no live url is shown below this, please click on "..." or "Show quoted text" to show trimmed content.
            Live Allure report: ${{ steps.deployment.outputs.page_url }}

      - name: Mark workflow failed if email configuration is missing
        if: always() && steps.email_config.outcome == 'failure'
        run: exit 1

      # continue-on-error above is only for preserving diagnostics; return the test's failure to GitHub at job end.
      - name: Mark workflow failed if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
